# WAL archiving settings for wal-g (included from postgresql.conf).
# archive_mode changes need a postgres restart; the rest reload.
wal_level = replica
archive_mode = on
archive_timeout = 300
# walg-archive.sh is a no-op when WALG_S3_PREFIX is unset (fail-soft for
# stacks without an S3 target) and propagates wal-g failures otherwise so
# postgres keeps + retries un-archived WAL. Its stderr lands in the postgres
# log (visible via `docker logs`).
archive_command = '/usr/local/bin/walg-archive.sh %p'
