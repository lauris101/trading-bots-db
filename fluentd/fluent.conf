# fluentd for the database host: every container's stdout (docker fluentd
# log driver, tag trading-bots.<container name>) into daily files under
# /logs/<UTC day>/<service>.log, one READABLE line per record
# (TIMESTAMP LEVEL target: message key=value ...).
# log-rotate (a sidecar) gzips finished days and purges after 7 days.

<system>
  log_level info
</system>

<source>
  @type forward
  bind 0.0.0.0
  port 24224
</source>

# service = the container name without the compose project prefix
# (trading-bots-postgres -> postgres).
<filter trading-bots.**>
  @type record_transformer
  enable_ruby true
  <record>
    service ${tag_parts[1].to_s.sub(/^trading-bots-/, '').sub(/^trading-bots-db-/, '')}
  </record>
</filter>

# The file gets a READABLE line, not the JSON the process wrote:
#   TIMESTAMP LEVEL target: message key=value ...
# (values with spaces quoted, nested values as JSON). Lines that are not JSON
# pass through as they are.
<filter trading-bots.**>
  @type record_transformer
  enable_ruby true
  <record>
    line ${begin; j = JSON.parse(record["log"]); raise ArgumentError unless j.is_a?(Hash); ts = j.delete("timestamp").to_s; lv = j.delete("level").to_s.ljust(5); tg = j.delete("target").to_s; msg = j.delete("message").to_s; kv = j.map do |k, v| s = v.is_a?(String) ? v : v.to_json; s = '"' + s + '"' if s.empty? || s =~ /\s/; k + "=" + s end; head = ts + " " + lv + (tg.empty? ? "" : " " + tg + ":") + " " + msg; kv.empty? ? head : head + " " + kv.join(" "); rescue StandardError; record["log"]; end}
  </record>
</filter>

<match trading-bots.**>
  @type file
  path /logs/%Y-%m-%d/${service}
  append true
  add_path_suffix true
  path_suffix .log
  <format>
    @type single_value
    message_key line
    add_newline true
  </format>
  <buffer time,service>
    @type file
    path /fluentd/buffer/files
    timekey 1d
    timekey_use_utc true
    timekey_wait 0s
    flush_mode interval
    flush_interval 5s
    flush_at_shutdown true
  </buffer>
</match>

<match **>
  @type stdout
</match>
