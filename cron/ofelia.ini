; Ofelia scheduler config (mounted into the `scheduler` service).
; Schedule format: 6-field cron (seconds first) or @descriptors.
; Jobs exec inside the running postgres container, which already carries the
; wal-g environment (root .env via env_file) and PGUSER/PGDATABASE.

; Nightly base backup at 02:30.
[job-exec "walg-nightly-backup"]
schedule = 0 30 2 * * *
container = trading-bots-postgres
user = postgres
command = wal-g backup-push /var/lib/postgresql/data
no-overlap = true

; Daily retention: keep the last 2 full backups, and only the WAL needed to
; restore either of them; everything older leaves R2. Daily at 03:30, after
; the nightly backup, since two kept backups are two days of history and a
; weekly pass would let five more pile up in between.
[job-exec "walg-daily-retention"]
schedule = 0 30 3 * * *
container = trading-bots-postgres
user = postgres
command = wal-g delete retain FULL 2 --confirm
no-overlap = true

; Daily freshness check at 06:00: fails loudly when the newest base backup is
; older than MAX_AGE_HOURS (30) and publishes the result to service_heartbeats
; (service 'walg-backup'), which the app's api shows in GET /status.
[job-exec "walg-freshness-check"]
schedule = 0 0 6 * * *
container = trading-bots-postgres
user = postgres
command = /usr/local/bin/walg-freshness.sh
no-overlap = true

; Daily at 00:10 UTC: gzip yesterday's log files, purge day directories older
; than KEEP_DAYS (LOG_KEEP_DAYS in .env). Runs inside the fluentd container,
; which has the log directory mounted at /logs.
[job-exec "logs-rotate"]
schedule = 0 10 0 * * *
container = trading-bots-db-fluentd
command = sh /rotate.sh
no-overlap = true

; Nightly docker cache trim at 05:00: the postgres image rebuilds grow
; BuildKit cache; --keep-storage retains the hot layers.
; job-run: a throwaway docker-cli container driving the host daemon.
; One command per job, no shell: ofelia's ini parser strips double quotes
; from a value, so `sh -c "a && b"` reaches the container as `sh -c a && b`,
; runs bare `docker` (usage on stderr, exit 0) and prunes nothing.
[job-run "docker-cache-prune"]
schedule = 0 0 5 * * *
image = docker:28-cli
volume = /var/run/docker.sock:/var/run/docker.sock
command = docker builder prune -f --keep-storage 5GB
no-overlap = true

; Dangling images, five minutes after the cache trim.
[job-run "docker-image-prune"]
schedule = 0 5 5 * * *
image = docker:28-cli
volume = /var/run/docker.sock:/var/run/docker.sock
command = docker image prune -f
no-overlap = true
